<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order_list</title>
</head>
<body>
     <!-- ul means unorder list , li means list items -->
    <ol>
        <li>car</li>
        <li>bus</li>
        <li>name</li>
        <li>class</li>
        <li>school</li>
    </ol>

    <ol type="A">
        <li>car</li>
        <li>bike</li>
    </ol>

    <ol type="a">
        <li>Name:</li>
        <li>Roll No:</li>
    </ol>

    <ol type="I">
        <li>Books</li>
        <li>Notes</li>
    </ol>

    <ol type="i">
        <li>Pc</li>
        <li>Mobile</li>
    </ol>
</body>
</html>
