<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input_label_tags</title>
</head>
<body>
    <form action="Post">
        <label for="username">Enter Your Name</label>
        <input type="text" name="username" placeholder="Enter your Name" autofocus required>
        <br><br>
        <label for="email">Enter Your Email</label>
        <input type="email" name="email" placeholder="Enter your Email">
        <br><br>
        <label for="Password">Enter User Password</label>
        <input type="text" name="Password" placeholder="Enter your Password" autofocus required>
        <br><br>
        <label for="Id">Enter Your Id</label>
        <input type="number" name="Id" placeholder="Enter your Id">
    </form>
</body>
</html>
