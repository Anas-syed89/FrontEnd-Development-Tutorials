<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        
        // var variable
        var fullName = "Ali";
        console.log(fullName); // Prints: Ali

        var fullName = "Ahmed"; // Re-declaration allowed
        console.log(fullName); // Prints: Ahmed

        fullName = "Bilal"; // Re-assignment allowed
        console.log(fullName); // Prints: Bilal




        // let variable
        let age = 20;
        console.log(age); // Prints: 20

        // let age = 25; ❌ Cannot re-declare with let in the same scope

        age = 25; // ✔ Re-assignment allowed
        console.log(age); // Prints: 25




        const country = "Pakistan";
        console.log(country); // Prints: Pakistan

        // country = "India"; ❌ Cannot re-assign a const variable
        // const country = "Japan"; ❌ Cannot re-declare a const variable

    </script>
</body>
</html>
