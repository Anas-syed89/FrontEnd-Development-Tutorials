<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Values from forms</title>
    <style>

        small {
            color: red;
            font-size: 12px;
        }

        .hide {
            display: none;
        }

        .passwordError {
            display: none;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" id="name" placeholder="name" >
        <div class="hide">
            <br>
            <small>Your Name should be greater than 5 characters</small>
        </div>
        <br><br>
        <input type="email" id="email" placeholder="email">
        <br><br>
        <input type="text" id="password" placeholder="password" required>  
        <div class="passwordError">
            <br>
            <small>Your password was not strong! please  use minimum 1 upperCase, 1 lowerCase, 1 number, & 1 special character character. And your password should be greater than 8 character</small>
        </div>
        <!-- Attribute->pattern="[a-z]{3,8}" but mostly used regex code -->
        <br><br>
        <select>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="others">Others</option>
        </select>
        <br><br>
        <textarea placeholder="Tell us about You"></textarea>
        <br><br>
        <input type="submit">
    </form>
    <script src="1_readingValues.js"></script>
</body>
</html>
