<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Updates</title>

    <style>
        .myName {
            width: 100%;
            height: 300px;
            border: 2px solid black;
            background-color: aquamarine;
            
        }
        .myName.myNameStyle {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #444;
            color: #307ae9;
            font-size: 30px;
        }
        .btn {
            margin: 30px;
            padding: 6px;
            background-color: #307ae9;
            cursor: pointer;
        }

        .box {
            margin: 30px;
            height: 200px;
            width: 200px;
            border: 2px solid salmon;
        }

        .btnBox {
            border: 2px solid #000;
            margin: 50px;
            border-radius: 40px;
            padding: 10px;
            font-size: 18px;
            background-color: #f3d8eb;
        }

        .box.boxStyle {
            width: 400px;
            color: #650101;
            font-weight: 600;
            background-color: #239bb6;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: capitalize;
        }
    </style>
</head>
<body>
    <h1>Hello! Are you Programmer</h1>
    <div class="myName">
        <h2>
            My name is syed anas ali.
        </h2>
    </div>

    <button class="btn" onclick="showStyle()">Add</button>
    <button class="btn" onclick="removeStyle()">Remove</button><br>
    <hr>
    <div class="box">Hello! Programming is all about logic.</div>
    <a class="btnBox" onclick="styling()">Toggle</a>
    <script src="4_styleUpdates.js"></script>
</body>
</html>
