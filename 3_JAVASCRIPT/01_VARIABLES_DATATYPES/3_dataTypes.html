<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dataTypes</title>
</head>
<body>
    <script>

        // String
        let name = "John"; // datatype: String
        console.log(typeof(name));


        // Number
        let age = 25; // datatype: Number
        let price = 99.99; // datatype: Number
        console.log(typeof(age, price));


        // Boolean
        let isOnline = true; // datatype: Boolean
        let isAdmin = false; // datatype: Boolean
        console.log(typeof(isOnline, isAdmin));


        // Null
        let data = null; // datatype: Null
        console.log(typeof(data));


        // Undefined
        let x; // datatype: Undefined (no value assigned)
        console.log(typeof(x));


        // Symbol
        let id1 = Symbol("id"); // datatype: Symbol
        let id2 = Symbol("id"); // datatype: Symbol
        console.log(typeof(id1, id2))

        // BigInt
        let bigNum = 123456789012345678901234567890n; // datatype:         BigInt
        console.log(typeof(bigNum))

    </script>
</body>
</html>
