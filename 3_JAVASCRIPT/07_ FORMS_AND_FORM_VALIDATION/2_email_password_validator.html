<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Password Validator</title>

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#6a11cb,#2575fc);
}

.container {
    background:#fff;
    padding:30px 40px;
    border-radius:10px;
    width:350px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    text-align:center;
    margin-bottom:20px;
}

.inputGroup {
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
}

label {
    margin-bottom:5px;
    font-weight:600;
}

input {
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    outline:none;
    font-size:14px;
}

input:focus {
    border-color:#2575fc;
}

.errorMessage {
    color:red;
    font-size:12px;
    margin-top:3px;
    display: none;
}

button {
    width:100%;
    padding:10px;
    border:none;
    background:#2575fc;
    color:#fff;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
    transition:0.3s;
}

button:hover {
    background:#1a5ed8;
}

</style>

</head>
<body>

<div class="container">
    <form autocomplete="off" id="form">
        <h2>Login</h2>

        <div class="inputGroup">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="Enter your email">
            <small class="errorMessage" id="emailError"></small>
        </div>

        <div class="inputGroup">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <small class="errorMessage" id="passwordError"></small>
        </div>

        <button type="submit">Submit</button>
        <div class="errorMessage resultMessage"></div>
    </form>
</div>

<script src="2_email_password_validator.js"></script>

</body>
</html>
