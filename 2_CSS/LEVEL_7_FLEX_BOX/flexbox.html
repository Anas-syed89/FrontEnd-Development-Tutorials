<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All About Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: cadetblue;
        }

        .parent {
            background-color: aquamarine;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;

        }
        .child {
            width: 200px;
            height: 200px;
            background-color: chocolate;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
        <div class="child"></div>
    </div>
</body>
</html>
