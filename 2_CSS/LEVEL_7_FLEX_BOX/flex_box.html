<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex_box</title>
    <style>
        .container {
            height: 200px;
            width: 900px;
            border: 2px solid blueviolet;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container_1 {
            height: 200px;
            width: 900px;
            border: 2px solid red;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
        }

        .container_2 {
            height: 200px;
            width: 900px;
            border: 2px solid firebrick;
            display: flex;
            justify-content: space-evenly;
            align-items: flex-end;
        }

        .container_3 {
            height: 200px;
            width: 900px;
            border: 2px solid indigo;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .box {
            height: 60px;
            width: 60px;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <br>

    <div class="container_1">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <br>

    <div class="container_2">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

        <br>

    <div class="container_3">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
