<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex_direction</title>
    <style>
        .container {
            height: 200px;
            width: 900px;
            border: 2px solid blueviolet;
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            align-items: center;
        }

        .container_1 {
            height: 200px;
            width: 900px;
            border: 2px solid steelblue;
            display: flex;
            flex-direction: column-reverse;
            justify-content: center;
            align-items: center;
        }
        
         .box {
            height: 60px;
            width: 60px;
            border: 2px solid black;
            background-color: cadetblue;
        }

        .box_box1{
            height: 60px;
            width: 60px;
            border: 2px solid black;
            background-color: aqua;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>

    <div class="container_1">
        <div class="box_box1">6</div>
        <div class="box_box1">7</div>
        <div class="box_box1">8</div>
        <div class="box_box1">9</div>
        <div class="box_box1">10</div>
    </div>
</body>
</html>
