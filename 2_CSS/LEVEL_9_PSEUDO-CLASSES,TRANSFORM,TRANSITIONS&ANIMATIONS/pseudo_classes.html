<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo_classes</title>
    <style>
        .pseudo {
            height: 25px;
            width: 150px;
            background-color: chocolate;
            border: 2px solid darkslategrey;
            border-radius: 5px;
        }
        .pseudo:hover {
            height: 50px;
            width: 160px;
            background-color: lightgray;
        }

        .pseudo:active {
            height: 50px;
            width: 160px;
            background-color: seagreen;
        }
    </style>
</head>
<body>
    <button class="pseudo">Learning pseudo</button>
</body>
</html>
