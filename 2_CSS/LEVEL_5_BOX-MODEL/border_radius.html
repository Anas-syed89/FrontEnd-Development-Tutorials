<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border Radius Example (2 Boxes)</title>
    <style>
        .box {
            width: 150px;
            height: 150px;
            border: 3px solid black;
            text-align: center;
            line-height: 150px; /* vertically center text */
            margin: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .box1 {
            background-color: lightblue;
            border-radius: 15px; /* slight round corners */
        }

        .box2 {
            background-color: lightgreen;
            border-radius: 50%; /* perfectly round (circle) */
        }
    </style>
</head>
<body>
    <div class="box box1">Box 1</div>
    <div class="box box2">Box 2</div>
</body>
</html>
