<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padding_property</title>
    <style>
        /* Example 1: Single value */
        .box1 {
            border: 2px solid black;
            padding: 20px; /* applies 20px on all sides */
        }

        /* Example 2: Two values */
        .box2 {
            border: 2px solid black;
            padding: 10px 30px; /* 10px top/bottom, 30px left/right */
        }

        /* Example 3: Three values */
        .box3 {
            border: 2px solid black;
            padding: 10px 20px 30px; /* top=10px, left/right=20px, bottom=30px */
        }

        /* Example 4: Four values */
        .box4 {
            border: 2px solid black;
            padding: 5px 10px 15px 20px; /* top, right, bottom, left */
        }

        /* Example 5: Combined with width */
        .box5 {
            border: 2px solid black;
            width: 200px;
            padding: 20px; /* equal padding inside */
        }
    </style>
</head>
<body>
    <div class="box1">box1</div>
    <div class="box2">box2</div>
    <div class="box3">box3</div>
    <div class="box4">box4</div>
    <div class="box5">box5</div>
</body>
</html>
