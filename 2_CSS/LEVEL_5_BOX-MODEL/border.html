<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border_property</title>
    <style>
        /* Example 1: Simple border */
        .box1 {
            border: 2px solid black; /* width, style, color */
            padding: 10px;
            margin: 10px;
        }

        /* Example 2: Different border widths */
        .box2 {
            border-width: 5px;
            border-style: solid;
            border-color: blue;
            padding: 10px;
            margin: 10px;
        }

        /* Example 3: Different styles */
        .box3 {
            border: 3px dashed red;
            padding: 10px;
            margin: 10px;
        }

        /* Example 4: Rounded border */
        .box4 {
            border: 4px solid green;
            border-radius: 15px; /* rounded corners */
            padding: 10px;
            margin: 10px;
        }

        /* Example 5: Individual sides */
        .box5 {
            border-top: 4px solid orange;
            border-right: 4px dotted purple;
            border-bottom: 4px dashed teal;
            border-left: 4px double brown;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="box1">box1 — solid black border</div>
    <div class="box2">box2 — thick blue border</div>
    <div class="box3">box3 — dashed red border</div>
    <div class="box4">box4 — rounded green border</div>
    <div class="box5">box5 — different border styles on each side</div>
</body>
</html>
