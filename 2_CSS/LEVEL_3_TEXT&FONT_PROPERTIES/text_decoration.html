<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text_Decoration</title>
</head>
<body>
    <h1 style="text-decoration: underline;">This is My text.</h1>
    <br>
    <h1 style="text-decoration: line-through;">This is My text.</h1>
    <br>
    <h1 style="text-decoration: dotted underline;">This is My text.</h1>
    <br>
    <h1 style="text-decoration: dashed overline;">This is My text.</h1>
    <br>
    <h1 style="text-decoration: double line-through;">This is My text.</h1>
    <br>
</body>
</html>
