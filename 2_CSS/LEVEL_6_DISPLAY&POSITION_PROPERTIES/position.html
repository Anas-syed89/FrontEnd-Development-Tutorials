<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position_property</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }


        .parent {
            padding: 43px;
            margin: 34px;
            border: 2px solid yellow;
            /* position: absolute; */
        }
        .box {
            height: 400px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
            border: 3px solid brown;
        }

        .b1 {
            background-color: greenyellow;
            /* position: absolute;
            top: 0px;
            left: 0px; */
        }
        .b2 {
            background-color: blue;
            /* position: relative;
            top: 5px;
            left: 50px; */
        }

        .b3 {
            background-color: goldenrod;
            /* position: fixed;
            bottom: 0px;
            left: 25vw; */
        }

        .b4 {
            background-color: violet;
            position: sticky;
            bottom: 0px;
            height: 111px;
            width: 100%;
            padding: 0;
            margin: 0;
        }
    </style>
</head>
<body> 
    <div class="parent">
    <div class="box b1"></div>
    <div class="box b2"></div>
    <div class="box b3"></div>
    <div class="box b4"></div>
    </div>
</body>
</html>
