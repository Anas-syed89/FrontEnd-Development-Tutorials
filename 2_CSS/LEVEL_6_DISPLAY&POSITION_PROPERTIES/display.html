<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display_property</title>
    <style>
        div {
            display: inline;
            background-color: aquamarine;
        }
        button {
            display: block;
            background-color: bisque;
        }
    </style>
</head>
<body>
    <div>This is my div.</div>
    <button>Click me</button>
</body>
</html>
