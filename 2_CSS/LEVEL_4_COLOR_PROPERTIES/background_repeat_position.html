<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background_repeat_position-Properties</title>
    <style>
        #box1 {
            background-image: url("./pic_1.png");
            height: 500px;
            width: 500px;
            background-repeat: no-repeat;
        }

        #box2 {
            background-image: url("./pic_3.png");
            height: 500px;
            width: 500px;
            background-size: 100px 100px;
            background-repeat: no-repeat;
            background-position: right;
        }
    </style>
</head>
<body>
    <div id="box1"></div>
    <div id="box2"></div>
</body>
</html>
